<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clickable Padlock</title>
    <style>
        /* ----- reset & centering ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
        }

        /* ----- wrapper keeps image + overlays together ----- */
        .lock-wrapper {
            position: relative;
            display: inline-block;
            /* Let the image set the natural size */
        }

        .lock-wrapper img {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            height: auto;
            width: auto;
            /* keeps the image crisp and exact */
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            transition: opacity 0.5s ease;
        }

        /* ============================================================
               CLICKABLE DIAL OVERLAYS
               Place these exactly over the numbers in your image.
               ============================================================ */
        .dial {
            position: absolute;
            /* ---- 👇 ADJUST THESE TO ALIGN WITH YOUR IMAGE ---- */
            top: 69.2%;          /* vertical position of the dials */
            width: 48px;       /* width of each clickable area */
            height: 48px;      /* height of each clickable area */
            transform: translate(-50%, -50%);
            /* ---- 👆 ADJUST THE ABOVE ---- */

            text-align: center;
            line-height: 48px;
            font-size: 30px;
            font-weight: 700;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: black;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            transition: transform 0.08s ease;
        }

        /* horizontal spacing – adjust left values */
        #dial1 { left: 29%; }   /* first dial */
        #dial2 { left: 50.5%; }   /* second dial */
        #dial3 { left: 72.5%; }   /* third dial */

        /* subtle press feedback */
        .dial:active {
            transform: translate(-50%, -50%) scale(0.88);
        }

        /* small hint that they are clickable (optional) */
        .dial:hover {
            filter: brightness(1.2);
        }

        /* Success message styling */
        .success-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2ecc71;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .success-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="lock-wrapper">
        <!-- ===== PADLOCK IMAGE ===== -->
        <img id="lockImage" src="Padlock.png" alt="Padlock" />

        <!-- ===== SUCCESS MESSAGE (appears when unlocked) ===== -->
        <div class="success-message" id="successMessage">🔓 UNLOCKED!</div>

        <!-- ===== THREE CLICKABLE DIALS ===== -->
        <div class="dial" id="dial1">3</div>
        <div class="dial" id="dial2">6</div>
        <div class="dial" id="dial3">2</div>
    </div>

    <script>
        (function() {
            // ==== SETTINGS ====
            const SECRET_CODE = [6, 6, 6];  // <-- CHANGE THIS TO YOUR SECRET CODE
            const UNLOCKED_IMAGE = 'Padlock2.png';  // <-- image shown when unlocked

            // ==== DOM ELEMENTS ====
            const dials = document.querySelectorAll('.dial');
            const lockImage = document.getElementById('lockImage');
            const successMessage = document.getElementById('successMessage');

            // ==== FUNCTION TO CHECK COMBINATION ====
            function checkCombination() {
                // Get current values from dials
                const currentCode = Array.from(dials).map(d => parseInt(d.textContent, 10));
                
                // Check if it matches the secret code
                const isCorrect = currentCode.length === SECRET_CODE.length &&
                                  currentCode.every((val, index) => val === SECRET_CODE[index]);

                if (isCorrect) {
                    // Switch to unlocked image
                    lockImage.src = UNLOCKED_IMAGE;
                    
                    // Show success message
                    successMessage.classList.add('show');
                    
                    // Hide dials (optional - they're no longer needed)
                    dials.forEach(dial => {
                        dial.style.display = 'none';
                    });
                    
                    // Optional: Play a sound or trigger other effects here
                    console.log('🔓 Unlocked!');
                }
            }

            // ==== SET UP DIAL CLICK EVENTS ====
            dials.forEach(dial => {
                dial.addEventListener('click', function(e) {
                    e.stopPropagation();

                    // Get current number (0-9)
                    let val = parseInt(this.textContent, 10);
                    if (isNaN(val) || val < 0 || val > 9) val = 0;

                    // Rotate to next digit (wrap 9 → 0)
                    val = (val + 1) % 10;
                    this.textContent = val;

                    // Check if the combination is correct
                    checkCombination();
                });
            });

            // ==== OPTIONAL: Reset ability (double-click the image to reset) ====
            lockImage.addEventListener('dblclick', function() {
                // Reset to locked image
                this.src = 'Padlock.png';
                
                // Reset dials to default (3, 6, 2)
                const defaultValues = [3, 6, 2];
                dials.forEach((dial, index) => {
                    dial.textContent = defaultValues[index];
                    dial.style.display = 'block';
                });
                
                // Hide success message
                successMessage.classList.remove('show');
                
                console.log('🔄 Reset to locked state');
            });
        })();
    </script>
</body>
</html>
