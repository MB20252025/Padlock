<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clickable Padlock</title>
    <style>
        /* ----- reset & centering ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
        }

        /* ----- wrapper keeps image + overlays together ----- */
        .lock-wrapper {
            position: relative;
            display: inline-block;
        }

        .lock-wrapper img {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            height: auto;
            width: auto;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            transition: opacity 0.5s ease;
        }

        /* ============================================================
               CLICKABLE DIAL OVERLAYS
               ============================================================ */
        .dial {
            position: absolute;
            /* ---- 👇 DEFAULT POSITION (for locked state) ---- */
            top: 69.2%;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            /* ---- 👆 ADJUST THE ABOVE ---- */

            text-align: center;
            line-height: 48px;
            font-size: 30px;
            font-weight: 700;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: black;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            transition: top 0.5s ease, left 0.5s ease, transform 0.08s ease, opacity 0.3s ease;
        }

        /* horizontal spacing – adjust left values (locked state) */
        #dial1 { left: 29%; }
        #dial2 { left: 50.5%; }
        #dial3 { left: 72.5%; }

        /* ---- 👇 UNLOCKED STATE POSITIONS (adjust these) ---- */
        #dial1.unlocked { 
            top: 71%;     /* move down */
            left: 29%;    /* move left */
        }
        #dial2.unlocked { 
            top: 71%;     /* move down */
            left: 51%;    /* stay centered */
        }
        #dial3.unlocked { 
            top: 71%;     /* move down */
            left: 73%;    /* move right */
        }

        /* subtle press feedback (only when clickable) */
        .dial:active {
            transform: translate(-50%, -50%) scale(0.88);
        }

        .dial:hover {
            filter: brightness(1.2);
        }

        /* ===== UNLOCKED STATE FOR DIALS ===== */
        .dial.unlocked {
            cursor: default !important;
            pointer-events: none !important;
            /* Color stays black */
        }

        /* ===== SUCCESS MESSAGE ===== */
        .success-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2ecc71;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .success-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="lock-wrapper">
        <!-- ===== PADLOCK IMAGE ===== -->
        <img id="lockImage" src="Padlock.png" alt="Padlock" />

        <!-- ===== SUCCESS MESSAGE ===== -->
        <div class="success-message" id="successMessage">🔓 UNLOCKED!</div>

        <!-- ===== THREE CLICKABLE DIALS ===== -->
        <div class="dial" id="dial1">3</div>
        <div class="dial" id="dial2">6</div>
        <div class="dial" id="dial3">2</div>
    </div>

    <script>
        (function() {
            // ==== SETTINGS ====
            const SECRET_CODE = [6, 6, 6];
            const UNLOCKED_IMAGE = 'Padlock2.png';
            const LOCKED_IMAGE = 'Padlock.png';
            const DEFAULT_VALUES = [3, 6, 2];

            // ==== DOM ELEMENTS ====
            const dials = document.querySelectorAll('.dial');
            const lockImage = document.getElementById('lockImage');
            const successMessage = document.getElementById('successMessage');

            // ==== STATE TRACKING ====
            let isUnlocked = false;

            // ==== FUNCTION TO CHECK COMBINATION ====
            function checkCombination() {
                if (isUnlocked) return;

                const currentCode = Array.from(dials).map(d => parseInt(d.textContent, 10));
                const isCorrect = currentCode.length === SECRET_CODE.length &&
                                  currentCode.every((val, index) => val === SECRET_CODE[index]);

                if (isCorrect) {
                    isUnlocked = true;
                    
                    lockImage.src = UNLOCKED_IMAGE;
                    successMessage.classList.add('show');
                    
                    dials.forEach(dial => {
                        dial.classList.add('unlocked');
                    });
                    
                    console.log('🔓 Unlocked! Code:', currentCode.join(''));
                }
            }

            // ==== SET UP DIAL CLICK EVENTS ====
            dials.forEach(dial => {
                dial.addEventListener('click', function(e) {
                    e.stopPropagation();

                    if (isUnlocked) return;

                    let val = parseInt(this.textContent, 10);
                    if (isNaN(val) || val < 0 || val > 9) val = 0;

                    val = (val + 1) % 10;
                    this.textContent = val;

                    checkCombination();
                });
            });

            // ==== RESET FUNCTION =====
            function resetLock() {
                isUnlocked = false;
                lockImage.src = LOCKED_IMAGE;
                
                dials.forEach((dial, index) => {
                    dial.textContent = DEFAULT_VALUES[index];
                    dial.classList.remove('unlocked');
                });
                
                successMessage.classList.remove('show');
                console.log('🔄 Reset to locked state');
            }

            lockImage.addEventListener('dblclick', resetLock);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'r' || e.key === 'R') {
                    resetLock();
                }
            });

            console.log('🔐 Padlock loaded! Enter 666 to unlock.');
            console.log('💡 Double-click image or press "R" to reset.');
        })();
    </script>
</body>
</html>
