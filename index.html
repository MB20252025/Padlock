<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locker Padlocks</title>
    <style>
        /* ----- RESET & BODY ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1e2a36;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* ----- LOCKER VIEW (background + small locks) ----- */
        .locker-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }
        .locker-wrapper img {
            display: block;
            max-width: 92vw;
            max-height: 92vh;
            height: auto;
            width: auto;
            border-radius: 12px;
        }

        /* ============================================================
               SMALL PADLOCKS ON THE LOCKERS
               ============================================================ */
        .locker-padlock {
            position: absolute;
            left: 72%;
            width: 50px;
            height: auto;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            padding: 4px;
            border-radius: 8px;
            border: 2px solid rgba(255, 215, 0, 0.15);
        }
        .locker-padlock:hover {
            transform: translate(-50%, -50%) scale(1.15);
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
            border-color: rgba(255, 215, 0, 0.4);
        }
        .locker-padlock:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
        .locker-padlock img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
            pointer-events: none;
        }

        /* ============================================================
               INDIVIDUAL PADLOCK POSITIONS (adjust these!)
               ============================================================ */
        #lock1 { top: 10%; left: 70%; }
        #lock2 { top: 25%; left: 75%; }
        #lock3 { top: 40%; left: 68%; }
        #lock4 { top: 55%; left: 72%; }
        #lock5 { top: 70%; left: 65%; }
        #lock6 { top: 85%; left: 78%; }

        /* ============================================================
           MODAL – zoomed padlock with transparent number overlays
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Close button */
        .modal-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 44px;
            height: 44px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 10;
        }
        .modal-close:hover {
            transform: scale(1.1);
            background: #c0392b;
        }
        .modal-close:active {
            transform: scale(0.9);
        }

        /* ----- The actual padlock image wrapper ----- */
        .modal-padlock-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            background: #000;
        }

        .modal-padlock-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0;
            transition: opacity 0.25s ease;
        }

        /* ============================================================
               TRANSPARENT NUMBER OVERLAYS – LOCKED STATE (Padlock.png)
               ============================================================ */
        .modal-dial {
            position: absolute;
            top: 48%;
            width: 14%;
            height: 16%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 700;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #000;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease, opacity 0.3s ease;
            line-height: 1;
        }

        /* Horizontal positions for the LOCKED state (Padlock.png) */
        #modalDial1 { left: 29%; }
        #modalDial2 { left: 50%; }
        #modalDial3 { left: 71%; }

        /* ============================================================
               TRANSPARENT NUMBER OVERLAYS – UNLOCKED STATE (Padlock2.png)
               ============================================================ */
        .modal-dial.unlocked {
            top: 46%;
            cursor: default;
        }

        /* Horizontal positions for the UNLOCKED state (Padlock2.png) */
        #modalDial1.unlocked { left: 30%; }
        #modalDial2.unlocked { left: 51%; }
        #modalDial3.unlocked { left: 72%; }

        .modal-dial:active {
            transform: translate(-50%, -50%) scale(0.88);
        }
        .modal-dial:hover {
            filter: brightness(1.5);
        }
        .modal-dial.unlocked:hover {
            filter: none;
        }

        /* ----- Unlock message ----- */
        .modal-message {
            margin-top: 16px;
            font-size: 24px;
            font-weight: 700;
            color: #2ecc71;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            min-height: 40px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-message.show {
            opacity: 1;
        }

        /* ----- Responsive tweaks ----- */
        @media (max-width: 500px) {
            .modal-close {
                top: -10px;
                right: -10px;
                width: 36px;
                height: 36px;
                font-size: 20px;
            }
            .locker-padlock {
                width: 35px;
            }
            .modal-dial {
                font-size: clamp(20px, 5vw, 32px);
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    LOCKER VIEW
    ========================================================== -->
    <div class="locker-wrapper">
        <img src="locker.png" alt="Lockers 1-6" />

        <!-- 6 small padlocks – each with its own secret code -->
        <div class="locker-padlock" id="lock1" data-locker="1" data-code="352">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
        <div class="locker-padlock" id="lock2" data-locker="2" data-code="123">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
        <div class="locker-padlock" id="lock3" data-locker="3" data-code="789">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
        <div class="locker-padlock" id="lock4" data-locker="4" data-code="000">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
        <div class="locker-padlock" id="lock5" data-locker="5" data-code="555">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
        <div class="locker-padlock" id="lock6" data-locker="6" data-code="999">
            <img src="Padlock.png" alt="Padlock" onerror="this.onerror=null; this.src='Padlock2.png';" />
        </div>
    </div>

    <!-- ==========================================================
    MODAL – zoomed padlock with black transparent numbers
    ========================================================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>

            <div class="modal-padlock-wrapper">
                <img src="Padlock.png" alt="Padlock" id="padlockImg"
                     onerror="this.onerror=null; this.src='Padlock2.png';" />

                <!-- Three clickable number overlays -->
                <div class="modal-dial" id="modalDial1">0</div>
                <div class="modal-dial" id="modalDial2">0</div>
                <div class="modal-dial" id="modalDial3">0</div>
            </div>

            <div class="modal-message" id="modalMessage"></div>
        </div>
    </div>

    <!-- ==========================================================
    JAVASCRIPT
    ========================================================== -->
    <script>
        (function() {
            // ----- DOM refs -----
            var overlay = document.getElementById('modalOverlay');
            var closeBtn = document.getElementById('modalClose');
            var padlockImg = document.getElementById('padlockImg');
            var padlockIcons = document.querySelectorAll('.locker-padlock');
            var dials = [
                document.getElementById('modalDial1'),
                document.getElementById('modalDial2'),
                document.getElementById('modalDial3')
            ];
            var messageEl = document.getElementById('modalMessage');

            var currentSecretCode = [0, 0, 0];
            var isUnlocked = false;

            // ----- 1. MODAL OPEN / CLOSE -----
            padlockIcons.forEach(function(icon) {
                icon.addEventListener('click', function(e) {
                    e.stopPropagation();

                    // ---- RESET for a fresh attempt ----
                    padlockImg.src = 'Padlock.png';
                    
                    dials.forEach(function(dial) {
                        dial.classList.remove('unlocked');
                        dial.textContent = '0';
                        dial.dataset.value = '0';
                    });
                    
                    messageEl.textContent = '';
                    messageEl.classList.remove('show');
                    isUnlocked = false;

                    var codeStr = this.dataset.code;
                    if (codeStr && codeStr.length === 3) {
                        currentSecretCode = codeStr.split('').map(Number);
                    } else {
                        currentSecretCode = [0, 0, 0];
                    }

                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            function closeModal() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // ----- 2. ROTATING DIALS + AUTO-UNLOCK -----
            function checkAndUnlock() {
                if (isUnlocked) return;

                var currentCode = dials.map(function(d) { return parseInt(d.dataset.value, 10); });
                var isCorrect = currentCode.length === currentSecretCode.length &&
                                  currentCode.every(function(v, i) { return v === currentSecretCode[i]; });

                if (isCorrect) {
                    isUnlocked = true;
                    padlockImg.src = 'Padlock2.png';

                    dials.forEach(function(dial) {
                        dial.classList.add('unlocked');
                    });

                    messageEl.textContent = '🔓 Unlocked!';
                    messageEl.classList.add('show');
                }
            }

            // Initialize each dial
            dials.forEach(function(dial) {
                var val = parseInt(dial.textContent, 10);
                if (isNaN(val) || val < 0 || val > 9) val = 0;
                dial.dataset.value = val;

                dial.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isUnlocked) return;

                    var v = parseInt(this.dataset.value, 10);
                    v = (v + 1) % 10;
                    this.dataset.value = v;
                    this.textContent = v;

                    checkAndUnlock();
                });
            });

        })();
    </script>
</body>
</html>
